# Keeps the console readable: only Hibernate's own SQL / DDL lines are printed
# (through hibernate.show_sql), not the internal log chatter.
org.slf4j.simpleLogger.defaultLogLevel=error
org.slf4j.simpleLogger.log.org.hibernate.SQL=error
org.slf4j.simpleLogger.log.org.hibernate.tool.schema=error
org.slf4j.simpleLogger.showDateTime=false
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showLogName=false
org.slf4j.simpleLogger.showShortLogName=true
